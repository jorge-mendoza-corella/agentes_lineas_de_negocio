name: Deploy to VPS

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Verify secrets
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          TELEGRAM_BOT_TOKEN_SEBAS: ${{ secrets.TELEGRAM_BOT_TOKEN_SEBAS }}
          NEXT_PUBLIC_APP_URL: ${{ secrets.NEXT_PUBLIC_APP_URL }}
        run: |
          echo "=== Verificación de secrets críticos ==="
          echo "NEXT_PUBLIC_SUPABASE_URL : len=${#NEXT_PUBLIC_SUPABASE_URL}  prefix='${NEXT_PUBLIC_SUPABASE_URL:0:12}'"
          echo "NEXT_PUBLIC_SUPABASE_ANON_KEY : len=${#NEXT_PUBLIC_SUPABASE_ANON_KEY}"
          echo "SUPABASE_SERVICE_ROLE_KEY : len=${#SUPABASE_SERVICE_ROLE_KEY}"
          echo "ANTHROPIC_API_KEY : len=${#ANTHROPIC_API_KEY}  prefix='${ANTHROPIC_API_KEY:0:7}'"
          echo "TELEGRAM_BOT_TOKEN_SEBAS : len=${#TELEGRAM_BOT_TOKEN_SEBAS}"
          echo "NEXT_PUBLIC_APP_URL : '${NEXT_PUBLIC_APP_URL}'"
          if [ "${NEXT_PUBLIC_SUPABASE_URL:0:8}" != "https://" ]; then
            echo "❌ FATAL: NEXT_PUBLIC_SUPABASE_URL no comienza con https:// — valor actual empieza con '${NEXT_PUBLIC_SUPABASE_URL:0:8}'"
            exit 1
          fi
          if [ -z "$SUPABASE_SERVICE_ROLE_KEY" ]; then
            echo "❌ FATAL: SUPABASE_SERVICE_ROLE_KEY está vacío"
            exit 1
          fi
          if [ -z "$ANTHROPIC_API_KEY" ]; then
            echo "❌ FATAL: ANTHROPIC_API_KEY está vacío"
            exit 1
          fi
          echo "✅ Secrets críticos verificados"

      - name: Create .env.docker from secrets
        run: |
          cat > .env.docker << 'EOF'
          ANTHROPIC_API_KEY=${{ secrets.ANTHROPIC_API_KEY }}
          CLOUDFLARE_API_TOKEN=${{ secrets.CLOUDFLARE_API_TOKEN }}
          GOOGLE_GEMINI_API_KEY=${{ secrets.GOOGLE_GEMINI_API_KEY }}
          INTERNAL_API_KEY=${{ secrets.INTERNAL_API_KEY }}
          JORGE_CHAT_ID=${{ secrets.JORGE_CHAT_ID }}
          NEXT_PUBLIC_APP_URL=${{ secrets.NEXT_PUBLIC_APP_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY=${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
          NEXT_PUBLIC_SUPABASE_URL=${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NODE_ENV=production
          NEXT_TELEMETRY_DISABLED=1
          REDIS_URL=redis://redis:6379
          SUPABASE_SERVICE_ROLE_KEY=${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          TELEGRAM_BOT_TOKEN=${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_BOT_TOKEN_SEBAS=${{ secrets.TELEGRAM_BOT_TOKEN_SEBAS }}
          TELEGRAM_CHAT_ID=${{ secrets.TELEGRAM_CHAT_ID }}
          SSH_KEY_PASSPHRASE=${{ secrets.SSH_KEY_PASSPHRASE }}
          SSH_SUDO_PASSWORD=${{ secrets.SSH_SUDO_PASSWORD }}
          VPS_HOST=${{ secrets.SSH_HOST }}
          VPS_USER=${{ secrets.SSH_USER }}
          DASHBOARD_URL=${{ secrets.NEXT_PUBLIC_APP_URL }}
          EOF

          echo "✅ .env.docker created:"
          wc -l .env.docker
          echo "--- primeras 5 líneas (solo nombres de vars) ---"
          head -5 .env.docker | cut -d= -f1
          echo "--- verificar que vars críticas no están pegadas ---"
          grep -c '^NEXT_PUBLIC_SUPABASE_URL=' .env.docker || echo "WARN: NEXT_PUBLIC_SUPABASE_URL no encontrada"
          grep -c '^SUPABASE_SERVICE_ROLE_KEY=' .env.docker || echo "WARN: SUPABASE_SERVICE_ROLE_KEY no encontrada"
          grep -c '^ANTHROPIC_API_KEY=' .env.docker || echo "WARN: ANTHROPIC_API_KEY no encontrada"

      - name: Deploy to VPS via SSH
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USER }}
          SSH_KEY_PASSPHRASE: ${{ secrets.SSH_KEY_PASSPHRASE }}
        run: |
          set -e
          mkdir -p ~/.ssh
          echo "$SSH_PRIVATE_KEY" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan -H "$SSH_HOST" >> ~/.ssh/known_hosts 2>/dev/null || true

          echo "📤 Transferring .env.docker to VPS..."
          scp -v -i ~/.ssh/id_rsa -o StrictHostKeyChecking=no -o ConnectTimeout=10 \
            .env.docker "$SSH_USER@$SSH_HOST:/home/srvsozu/.openclaw/workspace/agentes_lineas_de_negocio/.env.docker"

          echo "🚀 Redeploying containers..."
          ssh -i ~/.ssh/id_rsa -o StrictHostKeyChecking=no -o ConnectTimeout=30 -o ServerAliveInterval=60 -o ServerAliveCountMax=60 "$SSH_USER@$SSH_HOST" << 'SSHEOF'
          set -e
          cd /home/srvsozu/.openclaw/workspace/agentes_lineas_de_negocio
          echo "📂 Current directory: $(pwd)"

          echo "📥 Pulling latest code from main..."
          git fetch origin main
          git reset --hard origin/main

          echo "📄 Checking .env.docker:"
          ls -lh .env.docker
          echo "---"
          head -3 .env.docker
          echo "---"

          echo "📝 Escribiendo apps/dashboard/.env.local..."
          cp .env.docker apps/dashboard/.env.local
          echo "SSH_KEY_PATH=/app/.ssh/agent_key" >> apps/dashboard/.env.local

          echo "🔍 Verificando vars críticas en .env.docker..."
          SUPABASE_URL_VAL=$(grep -E '^NEXT_PUBLIC_SUPABASE_URL=' .env.docker | cut -d= -f2-)
          SRK_VAL=$(grep -E '^SUPABASE_SERVICE_ROLE_KEY=' .env.docker | cut -d= -f2-)
          ANON_KEY_VAL=$(grep -E '^NEXT_PUBLIC_SUPABASE_ANON_KEY=' .env.docker | cut -d= -f2-)
          if [ -z "$SUPABASE_URL_VAL" ]; then
            echo "FATAL: NEXT_PUBLIC_SUPABASE_URL está vacío en .env.docker"
            grep -v 'KEY\|TOKEN\|SECRET\|PASSWORD\|PASSPHRASE' .env.docker || true
            exit 1
          fi
          if [ -z "$SRK_VAL" ]; then
            echo "FATAL: SUPABASE_SERVICE_ROLE_KEY está vacío en .env.docker — probablemente pegada con otra var"
            echo "Líneas alrededor de SERVICE_ROLE:"
            grep -n 'SERVICE_ROLE\|SUPABASE_ANON' .env.docker | head -5
            exit 1
          fi
          if [ -z "$ANON_KEY_VAL" ]; then
            echo "FATAL: NEXT_PUBLIC_SUPABASE_ANON_KEY está vacío en .env.docker"
            exit 1
          fi
          echo "✅ NEXT_PUBLIC_SUPABASE_URL: $(echo $SUPABASE_URL_VAL | cut -c1-35)..."
          echo "✅ SUPABASE_SERVICE_ROLE_KEY: len=${#SRK_VAL}"
          echo "✅ NEXT_PUBLIC_SUPABASE_ANON_KEY: len=${#ANON_KEY_VAL}"

          echo "🛑 Stopping containers..."
          docker-compose --env-file .env.docker down --remove-orphans || true

          echo "🔨 Building new image (con build args desde .env.docker)..."
          docker-compose --env-file .env.docker build --no-cache

          echo "🚀 Starting containers..."
          docker-compose --env-file .env.docker up -d

          echo "✅ Deployment complete"
          docker-compose ps
          SSHEOF

      - name: Deployment complete
        run: echo "✅ Workflow finished successfully"
