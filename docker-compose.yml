services:
  dashboard:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: agentes-dashboard
    env_file:
      - apps/dashboard/.env.local
    environment:
      TZ: America/Mexico_City
    ports:
      - "3001:3000"
    volumes:
      - /home/srvsozu/.ssh/actions_key:/app/.ssh/agent_key:ro
    networks:
      - agentes-network
    restart: unless-stopped

  alo:
    image: node:22-alpine
    container_name: alo-orchestrator
    working_dir: /app
    command: sh -c "npm install --production && node packages/pm-global-orchestrator.js"
    env_file:
      - .env.docker
    environment:
      NODE_ENV: production
      TZ: America/Mexico_City
    volumes:
      - .:/app
      - alo_node_modules:/app/node_modules
    networks:
      - agentes-network
    depends_on:
      - redis
    restart: unless-stopped

  sebas:
    image: node:22-alpine
    container_name: sebas-orchestrator
    working_dir: /app
    command: sh -c "npm install --production && node packages/sebas-orchestrator.js"
    env_file:
      - .env.docker
    environment:
      NODE_ENV: production
      TZ: America/Mexico_City
    volumes:
      - .:/app
      - sebas_node_modules:/app/node_modules
    networks:
      - agentes-network
    depends_on:
      - redis
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: agentes-cache
    volumes:
      - redis_data:/data
    networks:
      - agentes-network
    restart: unless-stopped

volumes:
  redis_data:
    driver: local
  alo_node_modules:
    driver: local
  sebas_node_modules:
    driver: local

networks:
  agentes-network:
    driver: bridge
