services:
  dashboard:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: agentes-dashboard
    env_file:
      - apps/dashboard/.env.local
    environment:
      TZ: America/Mexico_City
    ports:
      - "3001:3000"
    volumes:
      - /home/srvsozu/.ssh/id_rsa:/app/.ssh/agent_key:ro
    networks:
      - agentes-network
    restart: unless-stopped

  alo:
    image: node:22-alpine
    container_name: alo-orchestrator
    working_dir: /app
    command: sh -c "npm install --production && node packages/pm-global-orchestrator.js"
    environment:
      NODE_ENV: ${NODE_ENV:-production}
      TZ: America/Mexico_City
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY}
      NEXT_PUBLIC_SUPABASE_URL: ${NEXT_PUBLIC_SUPABASE_URL}
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ${NEXT_PUBLIC_SUPABASE_ANON_KEY}
      SUPABASE_SERVICE_ROLE_KEY: ${SUPABASE_SERVICE_ROLE_KEY}
      GOOGLE_GEMINI_API_KEY: ${GOOGLE_GEMINI_API_KEY}
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN}
      JORGE_CHAT_ID: ${JORGE_CHAT_ID}
    volumes:
      - .:/app
      - alo_node_modules:/app/node_modules
    networks:
      - agentes-network
    depends_on:
      - redis
    restart: unless-stopped

  sebas:
    image: node:22-alpine
    container_name: sebas-orchestrator
    working_dir: /app
    command: sh -c "npm install --production && node packages/sebas-orchestrator.js"
    environment:
      NODE_ENV: ${NODE_ENV:-production}
      TZ: America/Mexico_City
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY}
      NEXT_PUBLIC_SUPABASE_URL: ${NEXT_PUBLIC_SUPABASE_URL}
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ${NEXT_PUBLIC_SUPABASE_ANON_KEY}
      SUPABASE_SERVICE_ROLE_KEY: ${SUPABASE_SERVICE_ROLE_KEY}
      GOOGLE_GEMINI_API_KEY: ${GOOGLE_GEMINI_API_KEY}
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN_SEBAS}
      JORGE_CHAT_ID: ${JORGE_CHAT_ID}
    volumes:
      - .:/app
      - sebas_node_modules:/app/node_modules
    networks:
      - agentes-network
    depends_on:
      - redis
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: agentes-cache
    volumes:
      - redis_data:/data
    networks:
      - agentes-network
    restart: unless-stopped

volumes:
  redis_data:
    driver: local
  alo_node_modules:
    driver: local
  sebas_node_modules:
    driver: local

networks:
  agentes-network:
    driver: bridge
